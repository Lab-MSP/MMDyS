# Loss weights for PhaseVideoMAEModel (full) and PhaseVideoMAEModelFlowOnly
# Best result: msdm_video_phase_v5b_t16_official
#
# For flow_only model: lambda_contrastive controls left/right contrastive loss.
# For full model:      lambda_soft_diag drives the phase-consensus head.

lambda_intra:     1.0
lambda_soft_diag: 0.6   # phase-consensus KL (full model only; unused by flow_only)
lambda_ordinal:   0.6
lambda_ce:        0.4
lambda_contrastive: 0.5  # left/right contrastive (flow_only model only)

soft_diag_temperature:    0.07
ordinal_base_margin:      0.12
ordinal_gap_margin_scale: 0.12

# Scheduled ramp-up: stabilise CE signal early, then increase metric losses
lambda_ce_schedule:
  - {start_epoch: 1,  end_epoch: 6,   value: 1.0}
  - {start_epoch: 7,  end_epoch: 200, value: 0.4}

lambda_intra_schedule:
  - {start_epoch: 1,  end_epoch: 6,   value: 0.2}
  - {start_epoch: 7,  end_epoch: 11,  value: 0.5}
  - {start_epoch: 12, end_epoch: 200, value: 1.0}

lambda_soft_diag_schedule:
  - {start_epoch: 1,  end_epoch: 6,   value: 0.1}
  - {start_epoch: 7,  end_epoch: 11,  value: 0.3}
  - {start_epoch: 12, end_epoch: 200, value: 0.6}

lambda_ordinal_schedule:
  - {start_epoch: 1,  end_epoch: 6,   value: 0.1}
  - {start_epoch: 7,  end_epoch: 11,  value: 0.35}
  - {start_epoch: 12, end_epoch: 200, value: 0.6}
